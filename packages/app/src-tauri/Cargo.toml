[package]
name = "lanforge"
version = "1.0.0"
description = "LANForge P2P Gaming Virtual LAN Engine"
authors = ["LANForge Team"]
edition = "2021"

[lib]
name = "lanforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
socket2 = { version = "0.5", features = ["all"] }
rand = "0.8"
thiserror = "1.0"
byteorder = "1.5"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
