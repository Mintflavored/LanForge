name: Release LANForge

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Package Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build Desktop Executable
        shell: pwsh
        run: |
          if (!(Test-Path "dist")) { New-Item -ItemType Directory -Force -Path "dist" }
          go build -ldflags="-s -w -H=windowsgui" -o dist/LANForge.exe ./cmd/desktop
          Copy-Item dist\LANForge.exe LANForge.exe -Force


      - name: Create Release Archive
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $zipName = "LANForge-$version-Windows-x64.zip"
          Copy-Item dist\LANForge.exe LANForge.exe -Force
          Compress-Archive -Path "LANForge.exe", "release_readme.txt" -DestinationPath $zipName -Force
          Write-Host "Created $zipName successfully"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "LANForge ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/LANForge.exe
            LANForge-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
