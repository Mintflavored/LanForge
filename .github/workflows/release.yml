name: Release LANForge

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Package Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build Go Signaling Engine
        shell: pwsh
        run: |
          if (!(Test-Path "bin")) { New-Item -ItemType Directory -Force -Path "bin" }
          go build -ldflags="-w -s" -o bin/lanforge-server.exe ./cmd/server

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywebview pystray pillow pythonnet clr_loader numpy

      - name: Package Monolithic LANForge Executable
        run: |
          python -m PyInstaller --noconsole --onefile --clean --name "LANForge" --icon app.ico --add-data "ui;ui" --add-data "app_icon.png;." --add-data "discord_banner.png;." --add-binary "bin/lanforge-server.exe;." --collect-all webview --collect-all pystray --collect-all PIL --collect-all clr_loader --collect-all pythonnet lanforge_gui.py --distpath ./dist

      - name: Create Release Archive
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $zipName = "LANForge-$version-Windows-x64.zip"
          Copy-Item dist\LANForge.exe LANForge.exe -Force
          Compress-Archive -Path "LANForge.exe", "release_readme.txt" -DestinationPath $zipName -Force
          Write-Host "Created $zipName successfully"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "LANForge ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/LANForge.exe
            LANForge-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
